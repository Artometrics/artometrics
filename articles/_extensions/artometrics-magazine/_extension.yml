title: Artometrics Magazine
author: Artometrics
version: 1.0.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    typst:
      template: template.typ
      include-in-header: definitions.typ
      filters:
        - magazine.lua
      papersize: us-letter
      mainfont: "DM Sans"
      fontsize: 10.5pt
      toc: false
      number-sections: false
    html:
      theme: none
      css: magazine.css
      template: template.html
      filters:
        - magazine.lua
      toc: false
      anchor-sections: false
      citations-hover: false
      footnotes-hover: false
      html-math-method: plain
      fig-cap-location: bottom
      page-layout: full
      minimal: true
      embed-resources: true
