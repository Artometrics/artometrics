<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap"/>
<style>
  html,body { margin:0; height:100%; background:#0a0a0a; color:#fff; }
  body { display:flex; flex-direction:column; padding:28px 36px 18px; box-sizing:border-box; font-family:"DM Sans",sans-serif; }
  h1 { font-size:34px; font-weight:600; margin:0 0 8px; letter-spacing:-0.02em; }
  .sub { font-family:"DM Mono",monospace; font-size:16px; color:#9a9a9a; margin:0 0 18px; }
  .plot { flex:1; min-height:0; }
  .chart-svg { width:100%; height:100%; }
  .src { font-family:"DM Mono",monospace; font-size:14px; color:#8a8a8a; margin:10px 0 0; }
  .stage-data { opacity:0; animation:rise .7s ease forwards; }
  .stage-highlight { opacity:0; animation:rise .35s ease 1.15s forwards; }
  .bar { transform-box:fill-box; transform-origin:left center; }
  @keyframes rise { from { opacity:0; } to { opacity:1; } }
</style></head>
<body>
  <h1>Parks and products sit beside the films.</h1>
  <p class="sub">Disney segment revenue, FY2024</p>
  <div class="plot"><svg class="chart-svg" viewBox="0 0 1600 224" xmlns="http://www.w3.org/2000/svg" role="img">
<line class="stage-axes" x1="340" y1="24" x2="340" y2="196" stroke="#3a3a3a" stroke-width="1"/>
<line class="stage-axes" x1="340" y1="196" x2="1560" y2="196" stroke="#3a3a3a" stroke-width="1"/>
<text class="stage-axes" x="328" y="62.400000000000006" text-anchor="end" fill="#d0d0d0" font-family="DM Mono, monospace" font-size="15">Disney Sports</text>
<rect class="stage-data bar" x="340" y="42" width="487.7" height="34" fill="#6a6a6a" style="animation-delay:0.35s"/>
<text class="stage-data" x="835.7" y="62.400000000000006" fill="#fff" font-family="DM Mono, monospace" font-size="15" style="animation-delay:0.35s">17.619</text>
<text class="stage-axes" x="328" y="110.4" text-anchor="end" fill="#d0d0d0" font-family="DM Mono, monospace" font-size="15">Disney Experiences</text>
<rect class="stage-data bar" x="340" y="90" width="945.3" height="34" fill="#6a6a6a" style="animation-delay:0.39s"/>
<text class="stage-data" x="1293.3" y="110.4" fill="#fff" font-family="DM Mono, monospace" font-size="15" style="animation-delay:0.39s">34.151</text>
<text class="stage-axes" x="328" y="158.4" text-anchor="end" fill="#d0d0d0" font-family="DM Mono, monospace" font-size="15">Disney Entertainment</text>
<rect class="stage-data bar" x="340" y="138" width="1140.0" height="34" fill="#E60000" style="animation-delay:0.43s"/>
<text class="stage-data" x="1488.0" y="158.4" fill="#fff" font-family="DM Mono, monospace" font-size="15" style="animation-delay:0.43s">41.186</text>
<rect class="stage-highlight" x="336" y="134" width="1218.0" height="42" fill="none" stroke="#E60000" stroke-width="3"/>
</svg></div>
  <p class="src">Source: Disney FY2024 report</p>
  <script>
    const q = new URLSearchParams(location.search);
    const hl = (q.get("hl") || "").toLowerCase();
    if (hl) {
      document.querySelectorAll(".chart-svg text").forEach((t) => {
        if (t.textContent.toLowerCase().includes(hl)) {
          const y = t.getAttribute("y");
          t.setAttribute("fill", "#fff");
        }
      });
    }
    setTimeout(() => document.body.setAttribute("data-chart-ready", "1"), 1500);
  </script>
</body></html>
