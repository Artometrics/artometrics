<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap"/>
<style>
  html,body { margin:0; height:100%; background:#0a0a0a; color:#fff; }
  body { display:flex; flex-direction:column; padding:28px 36px 18px; box-sizing:border-box; font-family:"DM Sans",sans-serif; }
  h1 { font-size:34px; font-weight:600; margin:0 0 8px; letter-spacing:-0.02em; }
  .sub { font-family:"DM Mono",monospace; font-size:16px; color:#9a9a9a; margin:0 0 18px; }
  .plot { flex:1; min-height:0; }
  .chart-svg { width:100%; height:100%; }
  .src { font-family:"DM Mono",monospace; font-size:14px; color:#8a8a8a; margin:10px 0 0; }
  .stage-data { opacity:0; animation:rise .7s ease forwards; }
  .stage-highlight { opacity:0; animation:rise .35s ease 1.15s forwards; }
  .bar { transform-box:fill-box; transform-origin:left center; }
  @keyframes rise { from { opacity:0; } to { opacity:1; } }
</style></head>
<body>
  <h1>Nine of ten domestic hits were already franchises.</h1>
  <p class="sub">Share of yearly top-ten films coded as franchise titles</p>
  <div class="plot"><svg class="chart-svg" viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg">
<line class="stage-axes" x1="80" y1="40" x2="80" y2="570" stroke="#3a3a3a"/>
<line class="stage-axes" x1="80" y1="570" x2="1560" y2="570" stroke="#3a3a3a"/>
<circle class="stage-data" cx="240.0" cy="570.0" r="8" fill="#0047FF" style="animation-delay:0.40s"/>
<text class="stage-data" x="240.0" y="612" text-anchor="middle" fill="#bbb" font-family="DM Mono, monospace" font-size="13">1</text>
<circle class="stage-data" cx="480.0" cy="406.7" r="8" fill="#0047FF" style="animation-delay:0.48s"/>
<text class="stage-data" x="480.0" y="612" text-anchor="middle" fill="#bbb" font-family="DM Mono, monospace" font-size="13">2</text>
<circle class="stage-data" cx="720.0" cy="243.3" r="8" fill="#0047FF" style="animation-delay:0.56s"/>
<text class="stage-data" x="720.0" y="612" text-anchor="middle" fill="#bbb" font-family="DM Mono, monospace" font-size="13">3</text>
<circle class="stage-data" cx="960.0" cy="243.3" r="8" fill="#0047FF" style="animation-delay:0.64s"/>
<text class="stage-data" x="960.0" y="612" text-anchor="middle" fill="#bbb" font-family="DM Mono, monospace" font-size="13">4</text>
<circle class="stage-data" cx="1200.0" cy="243.3" r="8" fill="#0047FF" style="animation-delay:0.72s"/>
<text class="stage-data" x="1200.0" y="612" text-anchor="middle" fill="#bbb" font-family="DM Mono, monospace" font-size="13">5</text>
<circle class="stage-data" cx="1440.0" cy="80.0" r="8" fill="#0047FF" style="animation-delay:0.80s"/>
<text class="stage-data" x="1440.0" y="612" text-anchor="middle" fill="#bbb" font-family="DM Mono, monospace" font-size="13">6</text>
<rect class="stage-highlight" x="1404.0" y="52.0" width="72" height="40" fill="none" stroke="#E60000" stroke-width="3"/>
</svg></div>
  <p class="src">Source: Box Office Mojo yearly charts · S001 coding</p>
  <script>
    const q = new URLSearchParams(location.search);
    const hl = (q.get("hl") || "").toLowerCase();
    if (hl) {
      document.querySelectorAll(".chart-svg text").forEach((t) => {
        if (t.textContent.toLowerCase().includes(hl)) {
          const y = t.getAttribute("y");
          t.setAttribute("fill", "#fff");
        }
      });
    }
    setTimeout(() => document.body.setAttribute("data-chart-ready", "1"), 1500);
  </script>
</body></html>
