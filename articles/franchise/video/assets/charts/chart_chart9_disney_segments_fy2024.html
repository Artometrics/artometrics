<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap"/>
<style>
  html,body { margin:0; height:100%; background:#0a0a0a; color:#fff; }
  body { display:flex; flex-direction:column; padding:28px 36px 18px; box-sizing:border-box; font-family:"DM Sans",sans-serif; }
  h1 { font-size:34px; font-weight:600; margin:0 0 8px; letter-spacing:-0.02em; }
  .sub { font-family:"DM Mono",monospace; font-size:16px; color:#9a9a9a; margin:0 0 18px; }
  .plot { flex:1; min-height:0; }
  .chart-svg { width:100%; height:100%; }
  .src { font-family:"DM Mono",monospace; font-size:14px; color:#8a8a8a; margin:10px 0 0; }
  .stage-data { opacity:0; animation:rise .7s ease forwards; }
  .stage-highlight { opacity:0; animation:rise .35s ease 1.15s forwards; }
  .bar { transform-box:fill-box; transform-origin:left center; }
  @keyframes rise { from { opacity:0; } to { opacity:1; } }
</style></head>
<body>
  <h1>Disney Entertainment is $41.2bn. Disney Experiences is $34.2bn.</h1>
  <p class="sub">Disney segment revenue, FY2024 · unit $bn</p>
  <div class="plot"><svg class="chart-svg" viewBox="0 0 1536 702" preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg" role="img">
<line class="stage-axes" x1="420" y1="16" x2="420" y2="674" stroke="#4a4a4a" stroke-width="2"/>
<line class="stage-axes" x1="420" y1="674" x2="1500" y2="674" stroke="#4a4a4a" stroke-width="2"/>
<text class="stage-axes" x="1500" y="694" text-anchor="end" fill="#9a9a9a" font-family="DM Mono, monospace" font-size="20">$bn</text>
<text class="stage-axes" x="404" y="151.98666666666668" text-anchor="end" fill="#eee" font-family="DM Mono, monospace" font-size="22">Disney Sports</text>
<rect class="stage-data bar" x="420" y="55.5" width="374.7" height="140.4" fill="#6a6a6a" style="animation-delay:0.25s"/>
<text class="stage-data" x="804.7" y="152.0" fill="#fff" font-family="DM Mono, monospace" font-size="22" style="animation-delay:0.25s">$17.6bn</text>
<text class="stage-axes" x="404" y="371.32000000000005" text-anchor="end" fill="#eee" font-family="DM Mono, monospace" font-size="22">Disney Experiences</text>
<rect class="stage-data bar" x="420" y="274.8" width="726.4" height="140.4" fill="#6a6a6a" style="animation-delay:0.28s"/>
<text class="stage-data" x="1156.4" y="371.3" fill="#fff" font-family="DM Mono, monospace" font-size="22" style="animation-delay:0.28s">$34.2bn</text>
<text class="stage-axes" x="404" y="590.6533333333334" text-anchor="end" fill="#eee" font-family="DM Mono, monospace" font-size="22">Disney Entertainment</text>
<rect class="stage-data bar" x="420" y="494.1" width="876.0" height="140.4" fill="#E60000" style="animation-delay:0.31s"/>
<text class="stage-data" x="1306.0" y="590.7" fill="#fff" font-family="DM Mono, monospace" font-size="22" style="animation-delay:0.31s">$41.2bn</text>
<rect class="stage-highlight" x="1292.0" y="502.9" width="118" height="122.8" fill="none" stroke="#E60000" stroke-width="3"/>
</svg></div>
  <p class="src">Source: Disney FY2024 report</p>
  <script>
    const q = new URLSearchParams(location.search);
    const hl = (q.get("hl") || "").toLowerCase();
    if (hl) {
      document.querySelectorAll(".chart-svg text").forEach((t) => {
        if (t.textContent.toLowerCase().includes(hl)) {
          const y = t.getAttribute("y");
          t.setAttribute("fill", "#fff");
        }
      });
    }
    setTimeout(() => document.body.setAttribute("data-chart-ready", "1"), 1500);
  </script>
</body></html>
