<section class="slide slide-ai" id="{scene_id}" data-scene-id="{scene_id}" data-visual-type="AI illustration"
  data-prompt-id="{prompt_id}">
  <div class="slide-frame">
    <p class="slide-kicker dm-mono">Mechanism</p>
    <div class="ai-stage">
      <img class="ai-image" src="{ai_src}" alt="{prompt_id}" data-fallback="1" />
      <div class="ai-placeholder dm-mono">
        <span class="prompt-id">{prompt_id}</span>
        <span class="prompt-hint">AI illustration · generate via gen_ai_images.py</span>
      </div>
    </div>
    <p class="mechanism-caption dm-sans"><span class="red-box-target">{mechanism_label}</span></p>
  </div>
  <aside class="speaker-notes">{speaker_notes}</aside>
</section>
