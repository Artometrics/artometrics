<section class="slide slide-bookend" id="{scene_id}" data-scene-id="{scene_id}" data-visual-type="bookend">
  <div class="slide-frame">
    <div class="bookend-inner">
      <img class="bookend-logo" src="{logo_src}" alt="Artometrics" width="120" height="120" />
      <p class="bookend-wordmark chomsky">{bookend_label}</p>
      <p class="bookend-sub dm-sans">{bookend_sub}</p>
    </div>
  </div>
  <aside class="speaker-notes">{speaker_notes}</aside>
</section>
