<section class="slide slide-big-number" id="{scene_id}" data-scene-id="{scene_id}" data-visual-type="big-number card"
  data-count-up="{count_up_escaped}">
  <div class="slide-frame">
    <p class="slide-kicker dm-mono">{entity_label}</p>
    <div class="red-box-target big-number-block">
      <span class="count-up dm-mono" data-count-up="{count_up_escaped}">{count_display}</span>
    </div>
    <p class="context-line dm-sans">{context_line}</p>
  </div>
  <aside class="speaker-notes">{speaker_notes}</aside>
</section>
