<section class="slide slide-asset slide-{asset_class}" id="{scene_id}" data-scene-id="{scene_id}" data-visual-type="{visual_type}"
  data-entity="{entity_escaped}">
  <div class="slide-frame">
    <p class="entity-on-screen dm-mono red-box-target">{entity_label}</p>
    <div class="asset-stage">
      <img class="asset-image" src="{asset_src}" alt="{entity_label}" />
    </div>
    <p class="asset-credit dm-mono">{credit_line}</p>
  </div>
  <aside class="speaker-notes">{speaker_notes}</aside>
</section>
