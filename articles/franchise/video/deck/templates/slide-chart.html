<section class="slide slide-chart" id="{scene_id}" data-scene-id="{scene_id}" data-visual-type="chart beat"
  data-beat-target="{beat_target_escaped}" data-count-up="{count_up_escaped}">
  <div class="slide-frame">
    <p class="slide-kicker dm-mono">{chart_kicker}</p>
    <div class="chart-stage">
      <iframe class="chart-embed" src="{chart_src}" title="{chart_kicker}" loading="lazy"></iframe>
    </div>
    <div class="chart-beat-bar">
      <span class="red-box-target dm-mono chart-beat-label">{beat_label}</span>
    </div>
  </div>
  <aside class="speaker-notes">{speaker_notes}</aside>
</section>
