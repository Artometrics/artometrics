[project]
name = "photo-ai"
version = "0.1.0"
description = "Local photo intelligence pipeline for Madison studio"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "imagehash>=4.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "hdbscan>=0.8",
  "tqdm>=4.66",
  "firebase-admin>=6.5",
  "google-cloud-storage>=2.14",
  "open-clip-torch>=2.24",
  "torch",
  "torchvision",
  "onnxruntime>=1.17",
  "insightface>=0.7.3",
  "opencv-python-headless>=4.9",
]

[project.scripts]
photo-ai = "photo_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_ai"]
